{% extends "base.html" %}
{% block title %}{{ action }} Job{% endblock %}
{% block content %}
<div class="page-head">
    <h1>{{ action }} Job</h1>
    <a class="btn btn-secondary" href="{{ url_for('jobs') }}">Cancel</a>
</div>

{% if not companies %}
    <p class="empty">You need to <a href="{{ url_for('add_company') }}">add a company</a> before adding a job.</p>
{% else %}
<form method="post" class="card form">
    <div class="row">
        <label>Company <span class="req">*</span>
            <select name="company_id" required>
                <option value="">-- Select a company --</option>
                {% for c in companies %}
                    <option value="{{ c.company_id }}" {{ 'selected' if v(job, 'company_id')|string == c.company_id|string }}>{{ c.company_name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Job title <span class="req">*</span>
            <input type="text" name="job_title" maxlength="100" required value="{{ v(job, 'job_title') }}">
        </label>
    </div>
    <div class="row">
        <label>Job type
            <select name="job_type">
                <option value="">-- Select --</option>
                {% for t in job_types %}
                    <option value="{{ t }}" {{ 'selected' if v(job, 'job_type') == t }}>{{ t }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Date posted
            <input type="date" name="date_posted" value="{{ v(job, 'date_posted') }}">
        </label>
    </div>
    <div class="row">
        <label>Minimum salary ($)
            <input type="number" name="salary_min" min="0" step="1" value="{{ v(job, 'salary_min') }}">
        </label>
        <label>Maximum salary ($)
            <input type="number" name="salary_max" min="0" step="1" value="{{ v(job, 'salary_max') }}">
        </label>
    </div>
    <label>Job posting URL
        <input type="url" name="job_url" maxlength="300" placeholder="https://" value="{{ v(job, 'job_url') }}">
    </label>
    <label>Required skills <span class="hint">(comma-separated, used by Job Match)</span>
        <input type="text" name="requirements" placeholder="Python, SQL, Flask" value="{{ v(job, 'requirements') }}">
    </label>
    <button class="btn" type="submit">Save Job</button>
</form>
{% endif %}
{% endblock %}
